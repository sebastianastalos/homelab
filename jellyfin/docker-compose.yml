services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:10.11.11
    container_name: jellyfin
    env_file:
      - .env
    volumes:
      - /mnt/app/jellyfin/config:/config
      - /mnt/storage/mediadata/media:/data/media
    ports:
      - 8096:8096
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "107"
    labels:
      kuma.jellyfin.http.name: "Jellyfin"
      kuma.jellyfin.http.url: "https://jellyfin.sebastianastalos.com"
    restart: unless-stopped