services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.4.0
    container_name: prowlarr
    network_mode: "container:gluetun"
    env_file:
      - .env
    volumes:
      - /mnt/app/prowlarr/config:/config
    labels:
      kuma.prowlarr.http.name: "Prowlarr"
      kuma.prowlarr.http.url: "https://prowlarr.sebastianastalos.com"
    restart: unless-stopped