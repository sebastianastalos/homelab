services:
  grafana:
    image: grafana/grafana:13.2.1
    container_name: grafana
    user: "950:950"
    env_file:
      - .env
    volumes:
      - /mnt/app/grafana/data:/var/lib/grafana
    ports:
      - 3002:3000
    labels:
      kuma.grafana.http.name: "Grafana"
      kuma.grafana.http.url: "https://grafana.sebastianastalos.com"
    restart: unless-stopped
