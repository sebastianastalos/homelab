services:
  scrutiny:
    image: ghcr.io/analogj/scrutiny:v0.9.3-omnibus
    container_name: scrutiny
    env_file: .env
    privileged: true
    volumes:
      - /mnt/app/scrutiny/config:/opt/scrutiny/config
      - /mnt/app/scrutiny/influxdb:/opt/scrutiny/influxdb
      - /run/udev:/run/udev:ro
    ports:
      - "8086:8080"
    labels:
      kuma.scrutiny.http.name: "Scrutiny"
      kuma.scrutiny.http.url: "https://scrutiny.sebastianastalos.com"
    restart: unless-stopped
