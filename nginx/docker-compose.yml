services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    env_file: .env
    volumes:
      - /mnt/app/nginx/data:/data
      - /mnt/app/nginx/letsencrypt:/etc/letsencrypt
    ports:
      - "80:80"
      - "8181:81"
    restart: unless-stopped
