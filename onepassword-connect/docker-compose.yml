services:
  onepassword-connect-api:
    image: 1password/connect-api:1.8.2
    container_name: onepassword-connect-api
    env_file: .env
    # Two mounts, both needed:
    #
    # .op        the whole directory, rather than binding
    #            1password-credentials.json as a single file. A single-file bind
    #            mount pins one inode, so regenerating the credentials file
    #            would leave both containers reading the old, unlinked copy
    #            until recreated - the same trap as caddy/config/Caddyfile.
    # .op/data   explicitly, because BOTH images declare
    #            VOLUME /home/opuser/.op/data. Without this line Docker gives
    #            each container its own anonymous volume shadowing that path,
    #            so sync writes 1password.sqlite where api cannot see it and api
    #            loops "no database found" forever. Mounting the parent is not
    #            enough - the nested declared VOLUME wins unless named here.
    #
    # Contents must be 999:999 (opuser), with .op itself mode 700.
    volumes:
      - /mnt/app/onepassword-connect/op:/home/opuser/.op
      - /mnt/app/onepassword-connect/op/data:/home/opuser/.op/data
    ports:
      - "30358:8080"
    labels:
      kuma.onepassword-connect.http.name: "1Password Connect"
      kuma.onepassword-connect.http.url: "http://192.168.1.131:30358/heartbeat"
    restart: unless-stopped

  onepassword-connect-sync:
    image: 1password/connect-sync:1.8.2
    container_name: onepassword-connect-sync
    env_file: .env
    volumes:
      - /mnt/app/onepassword-connect/op:/home/opuser/.op
      - /mnt/app/onepassword-connect/op/data:/home/opuser/.op/data
    ports:
      - "30359:8080"
    restart: unless-stopped
