services:
  seerr:
    image: ghcr.io/seerr-team/seerr:v3.3.0
    container_name: seerr
    init: true
    env_file:
      - .env
    volumes:
      - /mnt/app/seerr/config:/app/config
    ports:
      - 5055:5055
    labels:
      kuma.seerr.http.name: "Seerr"
      kuma.seerr.http.url: "https://seerr.sebastianastalos.com"
    restart: unless-stopped