services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v1.13.2
    container_name: homepage
    env_file:
      - .env
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${NAS_IP}:3000,100.111.232.12:3000,truenas.mullet-snapper.ts.net:3000,home.sebastianastalos.com
    volumes:
      - /mnt/app/homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 3000:3000
    labels:
      kuma.homepage.http.name: "Homepage"
      kuma.homepage.http.url: "https://home.sebastianastalos.com"
    restart: unless-stopped