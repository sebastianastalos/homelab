name: Secrets canary

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'

jobs:
  canary:
    runs-on: self-hosted
    env:
      INFISICAL_DOMAIN: https://infisical.sebastianastalos.com
      INFISICAL_PROJECT_ID: ce6d3fcb-163a-4230-91c7-f28b8d738c94
      INFISICAL_DISABLE_UPDATE_CHECK: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Infisical CLI
        uses: ./.github/actions/infisical-cli

      - name: Check Infisical is up
        run: |
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$INFISICAL_DOMAIN/api/status" || true)
          if [ "$STATUS" != "200" ]; then
            echo "::error::$INFISICAL_DOMAIN/api/status returned ${STATUS:-no response}"
            exit 1
          fi
          echo "Infisical status: $STATUS"

      # Proves the deploy identity can still log in and read: the same path
      # deploy.yml takes. Prints the key count only, never a value.
      - name: Export a known folder
        env:
          INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: |
          INFISICAL_TOKEN=$(infisical login --method=universal-auth \
            --domain "$INFISICAL_DOMAIN" --silent --plain)
          if [ -z "$INFISICAL_TOKEN" ]; then
            echo "::error::Infisical login returned no token"
            exit 1
          fi
          echo "::add-mask::$INFISICAL_TOKEN"
          export INFISICAL_TOKEN
          umask 077
          OUT="$RUNNER_TEMP/canary.env"
          trap 'rm -f "$OUT"' EXIT
          infisical export --domain "$INFISICAL_DOMAIN" --projectId "$INFISICAL_PROJECT_ID" \
            --env prod --path /teamarr --format dotenv --silent -o "$OUT"
          if [ ! -s "$OUT" ]; then
            echo "::error::Infisical returned no secrets at /teamarr"
            exit 1
          fi
          echo "Exported $(grep -c '=' "$OUT") keys from /teamarr"
