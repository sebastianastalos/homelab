name: Metrics

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          TS_OAUTH_CLIENT_ID: op://Homelab/CI GitHub - Tailscale/Client ID
          TS_OAUTH_CLIENT_SECRET: op://Homelab/CI GitHub - Tailscale/Client Secret

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 100.111.232.12 >> ~/.ssh/known_hosts

      - name: Save metrics JSON
        run: |
          mkdir -p .github/metrics
          ssh truenas_admin@100.111.232.12 bash << 'ENDSSH' > .github/metrics/metrics.json
            PROM="http://192.168.1.131:9090/api/v1/query"
            CPU=$(curl -s "$PROM?query=round(100-(avg(irate(node_cpu_seconds_total{mode='idle'}[5m]))*100),0.1)" \
              | python3 -c "import sys,json; print(round(float(json.load(sys.stdin)['data']['result'][0]['value'][1]),1))")
            RAM_TOTAL=$(curl -s "$PROM?query=node_memory_MemTotal_bytes" \
              | python3 -c "import sys,json; print(float(json.load(sys.stdin)['data']['result'][0]['value'][1]))")
            RAM_AVAIL=$(curl -s "$PROM?query=node_memory_MemAvailable_bytes" \
              | python3 -c "import sys,json; print(float(json.load(sys.stdin)['data']['result'][0]['value'][1]))")
            RAM=$(python3 -c "print(round((1-$RAM_AVAIL/$RAM_TOTAL)*100,1))")
            UPTIME=$(curl -s "$PROM?query=round(node_time_seconds-node_boot_time_seconds)" \
              | python3 -c "import sys,json; print(int(float(json.load(sys.stdin)['data']['result'][0]['value'][1])//86400))")
            DISK=$(curl -s "$PROM?query=round((1-(node_filesystem_avail_bytes{mountpoint='/mnt/storage',fstype='zfs'}/node_filesystem_size_bytes{mountpoint='/mnt/storage',fstype='zfs'}))*100,0.1)" \
              | python3 -c "import sys,json; print(round(float(json.load(sys.stdin)['data']['result'][0]['value'][1]),1))")
            printf '{"cpu":%s,"ram":%s,"uptime_days":%s,"disk":%s}' "$CPU" "$RAM" "$UPTIME" "$DISK"
          ENDSSH

      - name: Commit metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/metrics/metrics.json
          git diff --staged --quiet || git commit -m "chore: update metrics"
          git push
