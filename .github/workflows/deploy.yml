name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - '**/docker-compose.yml'
      - '**/.env.tpl'
      - '**/.env.infisical'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    env:
      EXCLUDED: caddy tailscale immich infisical github-runner cadvisor actual-flow trading212
      INFISICAL_DOMAIN: https://infisical.sebastianastalos.com
      INFISICAL_PROJECT_ID: ce6d3fcb-163a-4230-91c7-f28b8d738c94
      INFISICAL_DISABLE_UPDATE_CHECK: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get changed compose files
        id: changed
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BASE="HEAD~1"
          else
            BASE="$BEFORE"
          fi
          echo "Diffing: $BASE..HEAD"
          CHANGED=$(git diff --name-only "$BASE" HEAD \
            | grep -E '/(docker-compose\.yml|\.env\.tpl|\.env\.infisical)$' \
            | sed -E 's#/(docker-compose\.yml|\.env\.tpl|\.env\.infisical)$##' \
            | sort -u | tr '\n' ' ' | xargs)
          echo "apps=$CHANGED" >> $GITHUB_OUTPUT
          echo "Changed apps: $CHANGED"

      - name: Install 1Password CLI
        if: steps.changed.outputs.apps != ''
        uses: 1password/install-cli-action@v4

      # The runner container only mounts /mnt/app, so the host's copy of the
      # CLI is out of reach. Fetched per run, pinned by hash.
      - name: Install Infisical CLI
        if: steps.changed.outputs.apps != ''
        run: |
          NEEDED=""
          for APP in ${{ steps.changed.outputs.apps }}; do
            if [ -f "$GITHUB_WORKSPACE/$APP/.env.infisical" ] \
               && ! echo " $EXCLUDED " | grep -qF " $APP "; then
              NEEDED="$APP"
            fi
          done
          if [ -z "$NEEDED" ]; then
            echo "No changed app uses Infisical"
            exit 0
          fi
          cd "$RUNNER_TEMP"
          curl -fsSL -o infisical.tar.gz \
            https://github.com/Infisical/cli/releases/download/v0.43.138/cli_0.43.138_linux_amd64.tar.gz
          echo "45a98380964650e4cc2b57ff5361d174afb55b3daf7c2465640d3a7bb7550f92  infisical.tar.gz" \
            | sha256sum -c -
          mkdir -p infisical-cli
          tar -xzf infisical.tar.gz -C infisical-cli infisical
          echo "$RUNNER_TEMP/infisical-cli" >> "$GITHUB_PATH"

      - name: Deploy changed apps
        if: steps.changed.outputs.apps != ''
        env:
          TRUENAS_API_KEY: ${{ secrets.TRUENAS_API_KEY }}
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: |
          for APP in ${{ steps.changed.outputs.apps }}; do
            # A removed app shows up as a changed path too. Nothing to deploy,
            # so skip rather than failing the run on every app deletion.
            if [ ! -f "$GITHUB_WORKSPACE/$APP/docker-compose.yml" ]; then
              echo "Skipping $APP (compose file removed)"
              continue
            fi
            if echo " $EXCLUDED " | grep -qF " $APP "; then
              echo "Skipping $APP (excluded from auto-deploy)"
              continue
            fi
            # An app with a .env.infisical has Infisical as the source of truth:
            # the file holds the folder path to export from. Same temp-file
            # pattern as the op branch below. Credentials and token reach the
            # CLI through env, never argv; one login serves every app.
            if [ -f "$GITHUB_WORKSPACE/$APP/.env.infisical" ]; then
              INFISICAL_PATH=$(awk '{ sub(/#.*/, ""); gsub(/[[:space:]]/, "") } NF { print; exit }' \
                "$GITHUB_WORKSPACE/$APP/.env.infisical")
              if [ -z "$INFISICAL_PATH" ]; then
                echo "::error::$APP/.env.infisical has no folder path"
                exit 1
              fi
              if [ -z "${INFISICAL_TOKEN:-}" ]; then
                INFISICAL_TOKEN=$(infisical login --method=universal-auth \
                  --domain "$INFISICAL_DOMAIN" --silent --plain)
                if [ -z "$INFISICAL_TOKEN" ]; then
                  echo "::error::Infisical login returned no token"
                  exit 1
                fi
                echo "::add-mask::$INFISICAL_TOKEN"
                export INFISICAL_TOKEN
              fi
              echo "Rendering $APP/.env from Infisical $INFISICAL_PATH"
              infisical export --domain "$INFISICAL_DOMAIN" --projectId "$INFISICAL_PROJECT_ID" \
                --env prod --path "$INFISICAL_PATH" --format dotenv --silent -o "/tmp/$APP.env"
              if [ ! -s "/tmp/$APP.env" ]; then
                rm -f "/tmp/$APP.env"
                echo "::error::Infisical returned no secrets for $APP at $INFISICAL_PATH"
                exit 1
              fi
              install -m 644 -o 950 -g 950 "/tmp/$APP.env" "/mnt/app/$APP/.env"
              rm -f "/tmp/$APP.env"
            # An app with a .env.tpl has 1Password as the source of truth for its
            # secrets: render op:// references into .env before redeploying.
            # Rendered to a temp file first so a failed lookup aborts the step
            # (bash -e) without having truncated a working .env.
            elif [ -f "$GITHUB_WORKSPACE/$APP/.env.tpl" ]; then
              echo "Rendering $APP/.env from .env.tpl"
              op inject --force -i "$GITHUB_WORKSPACE/$APP/.env.tpl" -o "/tmp/$APP.env"
              install -m 644 -o 950 -g 950 "/tmp/$APP.env" "/mnt/app/$APP/.env"
              rm -f "/tmp/$APP.env"
            fi
            echo "Restarting $APP..."
            cp $GITHUB_WORKSPACE/$APP/docker-compose.yml /mnt/app/$APP/docker-compose.yml
            python3 /mnt/app/scripts/truenas-app.py $APP
          done
