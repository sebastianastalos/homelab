name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - '**/docker-compose.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get changed compose files
        id: changed
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD | grep 'docker-compose.yml' | sed 's|/docker-compose.yml||')
          echo "apps=$CHANGED" >> $GITHUB_OUTPUT
          echo "Changed apps: $CHANGED"

      - name: Load secrets from 1Password
        if: steps.changed.outputs.apps != ''
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          TS_OAUTH_CLIENT_ID: op://Homelab/CI GitHub - Tailscale/Client ID
          TS_OAUTH_CLIENT_SECRET: op://Homelab/CI GitHub - Tailscale/Client Secret

      - name: Connect to Tailscale
        if: steps.changed.outputs.apps != ''
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Setup SSH key
        if: steps.changed.outputs.apps != ''
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 100.111.232.12 >> ~/.ssh/known_hosts

      - name: Deploy changed apps
        if: steps.changed.outputs.apps != ''
        run: |
          EXCLUDED="caddy tailscale gluetun immich paperless"
          for APP in ${{ steps.changed.outputs.apps }}; do
            if echo "$EXCLUDED" | grep -qw "$APP"; then
              echo "Skipping $APP (excluded from auto-deploy)"
              continue
            fi
            echo "Restarting $APP..."
            ssh truenas_admin@100.111.232.12 "cd /mnt/app/$APP && sudo docker compose pull && sudo docker compose up -d"
          done
