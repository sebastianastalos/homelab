name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - '**/docker-compose.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get changed compose files
        id: changed
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BASE="HEAD~1"
          else
            BASE="$BEFORE"
          fi
          echo "Diffing: $BASE..HEAD"
          CHANGED=$(git diff --name-only "$BASE" HEAD | grep 'docker-compose.yml' | sed 's|/docker-compose.yml||' | tr '\n' ' ' | xargs)
          echo "apps=$CHANGED" >> $GITHUB_OUTPUT
          echo "Changed apps: $CHANGED"

      - name: Deploy changed apps
        if: steps.changed.outputs.apps != ''
        env:
          TRUENAS_API_KEY: ${{ secrets.TRUENAS_API_KEY }}
        run: |
          EXCLUDED="caddy tailscale gluetun immich paperless github-runner cadvisor jellystat"
          for APP in ${{ steps.changed.outputs.apps }}; do
            if echo "$EXCLUDED" | grep -qw "$APP"; then
              echo "Skipping $APP (excluded from auto-deploy)"
              continue
            fi
            echo "Restarting $APP..."
            cp $GITHUB_WORKSPACE/$APP/docker-compose.yml /mnt/app/$APP/docker-compose.yml
            python3 /mnt/app/scripts/truenas-app.py $APP
          done
