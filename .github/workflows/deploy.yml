name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - '**/docker-compose.yml'
      - '**/.env.tpl'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get changed compose files
        id: changed
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BASE="HEAD~1"
          else
            BASE="$BEFORE"
          fi
          echo "Diffing: $BASE..HEAD"
          CHANGED=$(git diff --name-only "$BASE" HEAD \
            | grep -E '/(docker-compose\.yml|\.env\.tpl)$' \
            | sed -E 's#/(docker-compose\.yml|\.env\.tpl)$##' \
            | sort -u | tr '\n' ' ' | xargs)
          echo "apps=$CHANGED" >> $GITHUB_OUTPUT
          echo "Changed apps: $CHANGED"

      - name: Install 1Password CLI
        if: steps.changed.outputs.apps != ''
        uses: 1password/install-cli-action@v4

      - name: Deploy changed apps
        if: steps.changed.outputs.apps != ''
        env:
          TRUENAS_API_KEY: ${{ secrets.TRUENAS_API_KEY }}
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          EXCLUDED="caddy tailscale immich github-runner cadvisor jellystat"
          for APP in ${{ steps.changed.outputs.apps }}; do
            # A removed app shows up as a changed path too. Nothing to deploy,
            # so skip rather than failing the run on every app deletion.
            if [ ! -f "$GITHUB_WORKSPACE/$APP/docker-compose.yml" ]; then
              echo "Skipping $APP (compose file removed)"
              continue
            fi
            if echo "$EXCLUDED" | grep -qw "$APP"; then
              echo "Skipping $APP (excluded from auto-deploy)"
              continue
            fi
            # An app with a .env.tpl has 1Password as the source of truth for its
            # secrets: render op:// references into .env before redeploying.
            # Rendered to a temp file first so a failed lookup aborts the step
            # (bash -e) without having truncated a working .env.
            if [ -f "$GITHUB_WORKSPACE/$APP/.env.tpl" ]; then
              echo "Rendering $APP/.env from .env.tpl"
              op inject --force -i "$GITHUB_WORKSPACE/$APP/.env.tpl" -o "/tmp/$APP.env"
              install -m 644 -o 950 -g 950 "/tmp/$APP.env" "/mnt/app/$APP/.env"
              rm -f "/tmp/$APP.env"
            fi
            echo "Restarting $APP..."
            cp $GITHUB_WORKSPACE/$APP/docker-compose.yml /mnt/app/$APP/docker-compose.yml
            python3 /mnt/app/scripts/truenas-app.py $APP
          done
