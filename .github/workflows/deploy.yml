name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - '**/docker-compose.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get changed compose files
        id: changed
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD | grep 'docker-compose.yml' | sed 's|/docker-compose.yml||' | tr '\n' ' ' | xargs)
          echo "apps=$CHANGED" >> $GITHUB_OUTPUT
          echo "Changed apps: $CHANGED"

      - name: Deploy changed apps
        if: steps.changed.outputs.apps != ''
        env:
          TRUENAS_API_KEY: ${{ secrets.TRUENAS_API_KEY }}
        run: |
          EXCLUDED="caddy tailscale gluetun immich paperless github-runner cadvisor"
          for APP in ${{ steps.changed.outputs.apps }}; do
            if echo "$EXCLUDED" | grep -qw "$APP"; then
              echo "Skipping $APP (excluded from auto-deploy)"
              continue
            fi
            echo "Restarting $APP..."
            cd /mnt/app/$APP
            docker compose pull
            python3 /mnt/app/scripts/truenas-app.py stop $APP 2>/dev/null || true
            sleep 3
            python3 /mnt/app/scripts/truenas-app.py start $APP
          done
