name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  yaml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint YAML files
        uses: ibiqlik/action-yamllint@v3
        with:
          config_data: |
            extends: relaxed
            rules:
              line-length:
                max: 200
              truthy:
                allowed-values: ['true', 'false', 'on', 'off', 'yes', 'no']
              new-line-at-end-of-file: disable
              empty-lines: disable
