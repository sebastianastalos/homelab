name: Validate

on:
  pull_request:
    paths:
      - '**/docker-compose.yml'
      - '**/.env.example'
      - '**/.env.infisical'
  workflow_dispatch:

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate all compose files
        run: |
          FAILED=""
          for COMPOSE in $(find . -name 'docker-compose.yml' | sort); do
            APP=$(dirname "$COMPOSE")
            # Synthesise a throwaway .env from .env.example so compose
            # interpolation resolves. This job has no secrets access,
            # deliberately - dummy values still exercise every ${VAR} the
            # compose file uses. .env.infisical holds only a folder path, so
            # those apps must also carry a .env.example listing their keys.
            if [ -f "$APP/.env.infisical" ]; then
              if [ ! -f "$APP/.env.example" ]; then
                echo "$APP: FAILED (.env.infisical needs a .env.example listing its keys)"
                FAILED="$FAILED $APP"
                continue
              fi
              grep -v '^#' "$APP/.env.example" | grep -v '^$' > "$APP/.env"
            elif [ -f "$APP/.env.example" ]; then
              grep -v '^#' "$APP/.env.example" | grep -v '^$' > "$APP/.env"
            fi
            if docker compose -f "$COMPOSE" config --quiet 2>&1; then
              echo "$APP: OK"
            else
              echo "$APP: FAILED"
              FAILED="$FAILED $APP"
            fi
          done
          if [ -n "$FAILED" ]; then
            echo "Failed:$FAILED"
            exit 1
          fi
