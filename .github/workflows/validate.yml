name: Validate

on:
  pull_request:
    paths:
      - '**/docker-compose.yml'
      - '**/.env.example'
      - '**/.env.tpl'
  workflow_dispatch:

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate all compose files
        run: |
          FAILED=""
          for COMPOSE in $(find . -name 'docker-compose.yml' | sort); do
            APP=$(dirname "$COMPOSE")
            # Synthesise a throwaway .env so compose interpolation resolves.
            # .env.tpl is the current convention; .env.example is what older
            # apps still carry. op:// references cannot be resolved here - this
            # job has no vault access, deliberately - so they become a dummy
            # value. That still exercises every ${VAR} the compose file uses.
            if [ -f "$APP/.env.tpl" ]; then
              sed -E 's#=op://.*#=dummy-value-for-validation#' "$APP/.env.tpl" \
                | grep -vE '^[[:space:]]*#|^[[:space:]]*$' > "$APP/.env"
            elif [ -f "$APP/.env.example" ]; then
              grep -v '^#' "$APP/.env.example" | grep -v '^$' > "$APP/.env"
            fi
            if docker compose -f "$COMPOSE" config --quiet 2>&1; then
              echo "$APP: OK"
            else
              echo "$APP: FAILED"
              FAILED="$FAILED $APP"
            fi
          done
          if [ -n "$FAILED" ]; then
            echo "Failed:$FAILED"
            exit 1
          fi
