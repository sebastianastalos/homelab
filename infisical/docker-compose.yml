services:
  infisical:
    image: infisical/infisical:v0.166.8
    container_name: infisical
    env_file: .env
    depends_on:
      infisical-db:
        condition: service_healthy
      infisical-redis:
        condition: service_healthy
    ports:
      - "8088:8080"
    mem_limit: 1g
    labels:
      kuma.infisical.http.name: "Infisical"
      kuma.infisical.http.url: "https://infisical.sebastianastalos.com/api/status"
    restart: unless-stopped

  infisical-db:
    image: postgres:16.15-alpine
    container_name: infisical-db
    env_file: .env
    volumes:
      - /mnt/app/infisical/postgres:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  infisical-redis:
    image: redis:7.4.11-alpine
    container_name: infisical-redis
    volumes:
      - /mnt/app/infisical/redis:/data
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
