services:
  loki:
    image: grafana/loki:3.7.4
    container_name: loki
    user: "950:950"
    env_file: .env
    volumes:
      - /mnt/app/loki/config/loki.yml:/etc/loki/loki.yml:ro
      - /mnt/app/loki/data:/loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki.yml
    restart: unless-stopped
